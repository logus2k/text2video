# One-shot CLI container. Everything after the service name goes to generate.py:
#   docker compose run --rm text2video --prompt "A red fox trotting through fresh snow at sunrise"
services:
  text2video:
    build: .
    image: text2video:1.0
    # Run as the host user so files in outputs/ are not root-owned (export UID/GID or let them default to 1000).
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # PyTorch's default allocator fragments (29 GiB reserved for 19 GiB allocated at 720p/81 frames on the 14B
      # model) and the WSL2 driver starts paging; expandable_segments crashes on WSL2. See README "Memory budget".
      - PYTORCH_CUDA_ALLOC_CONF=backend:cudaMallocAsync
    volumes:
      - ./models:/app/models:ro
      - ./outputs:/app/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      options:
        max-size: "10m"
        max-file: "3"
